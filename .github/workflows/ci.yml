name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  secrets:
    name: LLMSecOps · no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked dotenv files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.local$)'; then
            echo "Tracked .env file — remove it from git."
            exit 1
          fi

  backend:
    name: MLOps · Guardian corpus and contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: MLOps · console lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (non-blocking — pre-existing builder warnings)
        run: npm run lint
        continue-on-error: true
      - name: Production build
        # Guards the deploy path: Railway runs this exact command, and a build
        # that only fails there is a failed deploy, not a failed check.
        run: npm run build
